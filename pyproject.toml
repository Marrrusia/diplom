[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reqtest-assistant"
version = "0.1.0"
description = "Интеллектуальная поддержка анализа покрытия требований"
requires-python = ">=3.11"
dependencies = ["PySide6>=6.7,<7", "pydantic>=2.7,<3", "python-docx>=1.1,<2", "openpyxl>=3.1,<4", "httpx>=0.27,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
reqtest = "reqtest.main:main"

[tool.setuptools.packages.find]
include = ["reqtest*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: интеграционные проверки полного рабочего процесса"]
